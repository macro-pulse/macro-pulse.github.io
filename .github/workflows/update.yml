name: Update data
on:
  schedule:
    - cron: "0 13,14,15,21 * * 1-5"   # weekdays: 9, 10, 11 AM & 5 PM EDT (8, 9, 10 AM & 4 PM EST)
    - cron: "0 11 * * *"              # daily incl. weekends: 7 AM EDT (6 AM EST)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data" && git pull --rebase -X theirs origin main && git push)
