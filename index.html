<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><title>Macro Pulse</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--up:#059669;--dn:#dc2626;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#141a24;--tx:#e5e7eb;--mu:#9ca3af;--bd:#232b38;--up:#34d399;--dn:#f87171;--ac:#60a5fa}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}h1{margin:0;font-size:26px;letter-spacing:-.02em}
h1 span{color:var(--ac)}#upd{color:var(--mu);font-size:13px;margin-top:4px}
main{max-width:1100px;margin:auto;padding:0 12px 24px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:20px 4px 8px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:block;color:inherit;text-decoration:none}
.l{font-size:13px;color:var(--mu);font-weight:600}.row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.ch{font-size:13px;font-weight:600}
.ex{font-size:14px;font-weight:600;color:var(--mu);letter-spacing:0}.up{color:var(--up)}.dn{color:var(--dn)}.m{font-size:12px;color:var(--mu);margin-top:6px}svg{display:block}
footer{text-align:center;color:var(--mu);font-size:12px;padding:16px 12px 32px}
</style></head><body>
<header><h1 id="t"></h1><div id="upd">Loading…</div></header><main id="m"></main>
<footer>Data: FRED, St. Louis Fed. Not investment advice.<br>"Exp." = nowcast for the next release: inflation from <a href="https://www.clevelandfed.org/indicators-and-data/inflation-nowcasting" style="color:inherit">Cleveland Fed Inflation Nowcasting</a>, GDP from <a href="https://www.atlantafed.org/cqer/research/gdpnow" style="color:inherit">Atlanta Fed GDPNow</a>. A model estimate, not a guarantee.</footer>
<script>
const SITE_TITLE="Macro Pulse";
document.getElementById('t').textContent=SITE_TITLE;document.title=SITE_TITLE;
const f=(x,d,u)=>{const s=Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});return u=='$'?'$'+s:u=='%'?s+'%':u?s+(u=='bp'?' bp':u):s};
function spark(a){if(!a||a.length<2)return'';const w=120,h=36,mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;
const p=a.map((v,i)=>(i*w/(a.length-1)).toFixed(1)+','+(h-2-(v-mn)/r*(h-4)).toFixed(1)).join(' ');
return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="var(--ac)" stroke-width="1.8" points="${p}"/></svg>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(D=>{
document.getElementById('upd').textContent='Last updated '+D.updated_et;
const gs={};D.indicators.forEach(i=>(gs[i.group]=gs[i.group]||[]).push(i));
let h='';for(const g of['Inflation','Labor','Growth','Rates','Markets']){if(!gs[g])continue;h+=`<h2>${g}</h2><div class="g">`;
for(const i of gs[g]){let body;
if(i.range)body=`<div class="v">${i.range[0].toFixed(2)}–${i.range[1].toFixed(2)}%</div><div class="m">As of ${i.date}</div>`;
else{const c=i.change,cl=c>0?'up':c<0?'dn':'';const cu=i.unit=='%'?' pp':i.unit=='bp'?' bp':i.unit=='K'?'K':'';
body=`<div class="row"><div><div class="v">${f(i.latest,i.decimals,i.unit)}${i.expected?` <span class="ex">(Exp. ${esc(i.expected.period)}: ${f(i.expected.value,i.decimals,i.unit)})</span>`:''}</div><div class="ch ${cl}">${c>0?'▲ +':c<0?'▼ ':''}${f(c,i.decimals,'')}${cu}</div></div>${spark(i.spark)}</div>
<div class="m">${esc(i.date)} · prior ${f(i.prior,i.decimals,i.unit)} (${esc(i.prior_date)})</div>`}
h+=`<a class="c" href="${esc(i.source)}" target="_blank" rel="noopener"><div class="l">${esc(i.label)}</div>${body}<div class="m">FRED: ${esc(i.series)} ↗${i.expected?' · Exp.: '+esc(i.expected.source):''}</div></a>`}
h+='</div>'}document.getElementById('m').innerHTML=h}).catch(()=>document.getElementById('upd').textContent='Data unavailable');
</script></body></html>
